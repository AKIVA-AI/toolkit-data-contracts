[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit-data-contracts"
version = "1.0.0"
description = "Contracts for LLM-shaped data: JSON Schema contracts, LLM presets, ODCS interop and drift checks."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AKIVA AI, LLC" }]
keywords = ["data-contracts", "json-schema", "odcs", "drift", "llm", "fine-tuning", "rag", "tool-calling"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AKIVA-AI/toolkit-data-contracts"
Documentation = "https://github.com/AKIVA-AI/toolkit-data-contracts#readme"
Repository = "https://github.com/AKIVA-AI/toolkit-data-contracts"
Issues = "https://github.com/AKIVA-AI/toolkit-data-contracts/issues"
Changelog = "https://github.com/AKIVA-AI/toolkit-data-contracts/blob/main/CHANGELOG.md"

[project.scripts]
toolkit-contracts = "toolkit_data_contracts_drift.cli:main"

[project.optional-dependencies]
odcs = ["PyYAML>=6.0"]
tiktoken = ["tiktoken>=0.7"]
lang = ["langdetect>=1.0.9"]
parquet = ["pyarrow>=14"]
dev = [
  "PyYAML>=6.0",
  "tiktoken>=0.7",
  "langdetect>=1.0.9",
  "numpy>=1.26",
  "scipy>=1.11",
  "pyarrow>=14",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "jsonschema>=4.18",
  "ruff>=0.6.0",
  "pyright>=1.1.380",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["toolkit_data_contracts_drift"]
omit = ["*/toolkit_data_contracts_drift/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["toolkit_data_contracts_drift"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toolkit_data_contracts_drift = ["py.typed"]
