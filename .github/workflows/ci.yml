name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" || pip install -e ".[dev]" --no-deps

    - name: Run tests with coverage
      run: |
        pytest --cov=src/toolkit_data_contracts_drift --cov-report=xml --cov-report=term -v

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      if: matrix.python-version == '3.11'
      with:
        file: ./coverage.xml


  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install dependencies
      # Upgrade the runner's preinstalled pip/setuptools so pip-audit reports on
      # this project's dependencies, not on stale tooling in the hosted image.
      run: |
        python -m pip install --upgrade pip setuptools
        pip install bandit pip-audit
        pip install -e ".[odcs,tiktoken,lang,parquet]"
    - name: Run Bandit
      run: bandit -r src/ -f json -o bandit-report.json
    - name: Upload Bandit report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: bandit-report
        path: bandit-report.json
    - name: Audit dependencies, every optional extra included
      run: pip-audit --skip-editable

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -e ".[dev]" mypy
    - name: Run ruff
      run: ruff check src/ tests/
    - name: Run mypy
      run: mypy src/ --ignore-missing-imports
    - name: Run pyright
      run: pyright

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Syft
      run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
    - name: Generate SBOM (CycloneDX)
      run: syft dir:. -o cyclonedx-json=sbom.cdx.json
    - name: Install Grype
      run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
    - name: Scan SBOM for vulnerabilities
      run: grype sbom:sbom.cdx.json --fail-on critical
    - name: Upload SBOM artifact
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: sbom
        path: sbom.cdx.json

  build:
    name: Build and check package
    runs-on: ubuntu-latest
    needs: [test, security, lint]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Build the sdist and wheel
      run: |
        python -m pip install --upgrade pip build "twine>=6.1"
        python -m build
    - name: Check the metadata (twine 6.1+ reads Metadata 2.4)
      run: twine check --strict dist/*
    - name: Install the wheel in a clean environment
      run: |
        python -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
        "$RUNNER_TEMP/venv/bin/toolkit-contracts" --help > /dev/null
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist-packages
        path: dist/

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        tags: toolkit-data-contracts:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  action:
    name: GitHub Action self-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Compatible change passes
      uses: ./
      with:
        old: tests/fixtures/diff/old.json
        new: tests/fixtures/diff/compatible.json
    - name: Breaking change fails
      id: breaking
      uses: ./
      continue-on-error: true
      with:
        old: tests/fixtures/diff/old.json
        new: tests/fixtures/diff/breaking.json
    - name: Assert the breaking diff failed
      if: steps.breaking.outcome != 'failure'
      run: |
        echo "expected the breaking diff to fail"
        exit 1

  all-checks:
    # The single required status check for main. It fails when any job
    # above failed or was cancelled; a skipped job counts as passing.
    if: always()
    needs: [test, security, lint, sbom, build, docker, action]
    runs-on: ubuntu-latest
    steps:
    - name: Verify every job passed
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "Job results: $RESULTS"
        for result in $RESULTS; do
          case "$result" in
            success|skipped) ;;
            *) echo "A required job ended with: $result"; exit 1 ;;
          esac
        done
